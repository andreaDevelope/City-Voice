<div class="dialog-overlay">
  <div
    class="login-dialog-container"
    tabindex="0"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-dialog-title"
    (click)="$event.stopPropagation()"
    (keydown.escape)="close()"
  >
    <button type="button" class="login-dialog-close" aria-label="Chiudi" (click)="close()">
      ×
    </button>
    <h2 id="login-dialog-title">City Voice</h2>
    <form [formGroup]="form">
      <label for="username">nome da supereroe</label>
      <input
        formControlName="username"
        placeholder=" ES. La Viaggiatrice.."
        type="text"
        id="username"
        name="username"
      />

      <label for="password">Password</label>
      <input
        formControlName="password"
        placeholder="Inserisci la tua password"
        type="password"
        id="password"
        name="password"
      />

      <button class="button" type="button" (click)="login()">
        <span class="shadow"></span>
        <span class="edge"></span>
        <div class="front">
          <span>ACCEDI</span>
        </div>
      </button>
    </form>
  </div>
</div>
