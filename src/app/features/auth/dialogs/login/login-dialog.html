<div class="dialog-overlay">
  <div
    class="login-dialog-container"
    tabindex="0"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-dialog-title"
    (click)="$event.stopPropagation()"
    (keydown.escape)="close()"
  >
    <button type="button" class="login-dialog-close" aria-label="Chiudi" (click)="close()">
      ×
    </button>
    <h2 id="login-dialog-title">City Voice</h2>
    @if (!recoveryMode) {
      <form [formGroup]="form">
        <label for="username">nome da supereroe</label>
        <input
          formControlName="username"
          placeholder=" ES. La Viaggiatrice.."
          type="text"
          id="username"
          name="username"
        />

        <label for="password">Password</label>
        <input
          formControlName="password"
          placeholder="Inserisci la tua password"
          type="password"
          id="password"
          name="password"
        />
        <button class="button" type="button" (click)="login()">
          <span class="shadow"></span>
          <span class="edge"></span>
          <div class="front">
            <span>ACCEDI</span>
          </div>
        </button>

        @if (errorMessage) {
          <p class="errorMessage">{{ errorMessage }}</p>
        }

        <button type="button" class="forgot-password-link" (click)="toggleRecoveryMode()">
          Password dimenticata?
        </button>

        <p class="switch-hint">
          Non hai un account?
          <button type="button" class="switch-link" (click)="goToSignup()">Registrati</button>
        </p>
      </form>
    }

    @if (recoveryMode) {
      <form [formGroup]="recoveryForm">
        <label for="recovery-username">nome da supereroe</label>
        <input formControlName="username" type="text" id="recovery-username" />

        <label for="recovery-key">chiave di recovery</label>
        <input
          formControlName="recoveryKey"
          type="text"
          id="recovery-key"
          placeholder="parola-parola-parola-parola-parola-parola"
        />

        <label for="new-password">nuova password</label>
        <input formControlName="newPassword" type="password" id="new-password" />

        @if (errorMessage) {
          <p class="errorMessage">{{ errorMessage }}</p>
        }
        @if (successMessage) {
          <p class="successMessage">{{ successMessage }}</p>
        }

        <button class="button" type="button" (click)="recover()">
          <span class="shadow"></span>
          <span class="edge"></span>
          <div class="front">
            <span>RECUPERA</span>
          </div>
        </button>

        <button type="button" class="forgot-password-link" (click)="toggleRecoveryMode()">
          Torna al login
        </button>
      </form>
    }
  </div>
</div>
