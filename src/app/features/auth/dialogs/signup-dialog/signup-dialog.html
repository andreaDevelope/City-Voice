<div class="dialog-overlay">
  <div
    class="login-dialog-container"
    tabindex="0"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-dialog-title"
    (click)="$event.stopPropagation()"
    (keydown.escape)="close()"
  >
    <button type="button" class="login-dialog-close" aria-label="Chiudi" (click)="close()">
      ×
    </button>
    <h2 id="login-dialog-title">City Voice</h2>
    <form [formGroup]="form">
      <label for="username">nome da supereroe</label>
      <input
        formControlName="username"
        placeholder=" ES. La Viaggiatrice.."
        type="text"
        id="username"
        name="username"
      />
      @if (usernameError(); as msg) {
        <p class="field-error">{{ msg }}</p>
      }

      <label for="password">Password</label>
      <input
        formControlName="password"
        placeholder="6–14 caratteri"
        type="password"
        id="password"
        name="password"
      />
      @if (passwordError(); as msg) {
        <p class="field-error">{{ msg }}</p>
      }

      <label for="confirmPassword">Conferma password</label>
      <input
        formControlName="confirmPassword"
        placeholder="Ripeti la password"
        type="password"
        autocomplete="new-password"
        id="confirmPassword"
        name="confirmPassword"
      />
      @if (confirmPasswordError(); as msg) {
        <p class="field-error">{{ msg }}</p>
      }

      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      <button
        class="submit-button"
        type="button"
        [disabled]="form.invalid || loading"
        (click)="signup()"
      >
        ISCRIVITI
      </button>

      <p class="switch-hint">
        Hai già un profilo?
        <button type="button" class="switch-link" (click)="goToLogin()">Accedi</button>
      </p>
    </form>
  </div>
</div>
