<div class="shell">
  <header class="shell-header">
    <app-header-app
      (loginClick)="openLoginDialog()"
      (signupClick)="openSignupDialog()"
    ></app-header-app>

    <app-nav-mobile class="nav-mobile"></app-nav-mobile>
  </header>

  <main class="shell-main">
    <router-outlet />
    @if (loginDialogOpen) {
      <app-login-dialog (closeDialog)="closeLoginDialog()"></app-login-dialog>
    }

    @if (signupDialogOpen) {
      <app-signup-dialog (closeSignupDialog)="closeSignupDialog()"></app-signup-dialog>
    }
  </main>
</div>
