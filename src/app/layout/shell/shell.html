<div class="shell">
  <header class="shell-header">
    <app-header-app
      (loginClick)="openLoginDialog()"
      (signupClick)="openSignupDialog()"
    ></app-header-app>

    <app-nav-mobile class="nav-mobile"></app-nav-mobile>
  </header>

  <main class="shell-main">
    <router-outlet />

    @if (loginDialogOpen()) {
      <app-login-dialog
        (closeDialog)="closeLoginDialog()"
        (switchToSignup)="switchToSignup()"
      ></app-login-dialog>
    }

    @if (signupDialogOpen()) {
      <app-signup-dialog
        (closeSignupDialog)="closeSignupDialog()"
        (registered)="onRegistered($event)"
      ></app-signup-dialog>
    }

    @if (recoveryKeyOpen()) {
      <app-recovery-key-dialog
        [recoveryKey]="recoveryKey()!"
        (confirmed)="onRecoveryKeyConfirmed()"
      ></app-recovery-key-dialog>
    }
  </main>
</div>
